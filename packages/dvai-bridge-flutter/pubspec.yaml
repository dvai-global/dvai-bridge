name: dvai_bridge
description: Local-LLM bridge with an OpenAI-compatible HTTP server for Flutter (iOS + Android). Wraps the native DVAIBridge SDKs via Pigeon-generated platform channels.
version: 4.3.0
homepage: https://github.com/dvai-global/dvai-bridge
repository: https://github.com/dvai-global/dvai-bridge
issue_tracker: https://github.com/dvai-global/dvai-bridge/issues
documentation: https://dvai-global.github.io/dvai-bridge/guide/flutter-sdk

# Floor pinned at Flutter 3.44 (current stable 3.50 −2 minor). Pigeon 29+
# (dev-only) needs a flutter_test that pins meta >=1.18, which first ships
# in Flutter 3.44. CI exercises 3.50.1 (latest) and 3.44.9 (floor).
environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pigeon: ">=29.0.2 <31.0.0"
  mockito: ^5.4.5
  build_runner: ^2.4.13

flutter:
  plugin:
    platforms:
      android:
        package: co.deepvoiceai.bridge.flutter
        pluginClass: DVAIBridgeFlutterPlugin
      ios:
        pluginClass: DVAIBridgeFlutterPlugin
