name: Flutter — dvai_bridge plugin

on:
  pull_request:
    paths:
      - 'packages/dvai-bridge-flutter/**'
      - '.github/workflows/test-flutter.yml'
  # Release-tag-only push trigger.
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze + flutter test (Flutter ${{ matrix.flutter-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Latest stable + the floor that satisfies `flutter: ">=3.44.0"`
        # in pubspec.yaml. 3.44 is the first stable whose flutter_test
        # pins meta >=1.18, which pigeon 29+ (dev dep) requires.
        flutter-version: ['3.50.1', '3.44.9']
    steps:
      - uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter ${{ matrix.flutter-version }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter-version }}
          channel: stable
          cache: true

      - name: Resolve Dart deps
        working-directory: packages/dvai-bridge-flutter
        run: flutter pub get

      - name: Pigeon codegen
        working-directory: packages/dvai-bridge-flutter
        run: dart run pigeon --input pigeons/messages.dart

      - name: flutter analyze
        working-directory: packages/dvai-bridge-flutter
        run: flutter analyze

      - name: flutter test
        working-directory: packages/dvai-bridge-flutter
        run: flutter test --reporter expanded

  pub-publish-dryrun:
    name: pub publish --dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only on tag pushes — gates the actual `dart pub publish` step in
    # PUBLISHING.md. PR builds skip this so the maintainer's pub.dev
    # auth doesn't get invoked accidentally.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7

      - name: Setup Flutter (latest stable)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true

      - name: Resolve Dart deps
        working-directory: packages/dvai-bridge-flutter
        run: flutter pub get

      - name: Pigeon codegen
        working-directory: packages/dvai-bridge-flutter
        run: dart run pigeon --input pigeons/messages.dart

      - name: dart pub publish --dry-run
        working-directory: packages/dvai-bridge-flutter
        run: dart pub publish --dry-run
