name: Deploy docs to GitHub Pages

# VitePress docs -> https://dvai-global.github.io/dvai-bridge/
# Fires on release tags (docs track the shipped version), on docs-only
# pushes to main, and manually.

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.1.1
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm

      # Docs import nothing from packages/, so install only the docs
      # workspace (skips every SDK's prepare/build hook).
      - run: pnpm install --frozen-lockfile --filter dvai-bridge-docs

      - name: Build VitePress site
        working-directory: docs
        run: pnpm run docs:build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
