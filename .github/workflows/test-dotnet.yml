name: .NET — DVAIBridge NuGet family

on:
  pull_request:
    paths:
      - 'packages/dvai-bridge-dotnet/**'
      - '.github/workflows/test-dotnet.yml'
  # Release-tag-only push trigger. Routine `git push origin main`
  # does NOT fire CI; use a PR for pre-merge validation or
  # workflow_dispatch for an ad-hoc run.
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Push NuGet packages to nuget.org on this run (defaults to false — used when the tag-trigger CI failed mid-pipeline and the artifacts need to be pushed manually).'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
  # Tag pushes drive the publish-to-NuGet.org step (gated by tag prefix).
  release:
    types: [published]

concurrency:
  group: dotnet-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_VERSION: '10.0.x'

jobs:
  # ------------------------------------------------------------------
  # Ubuntu: facade tests + Desktop slice + ONNX Runtime slice + ML.NET
  # slice build & test. Every csproj that compiles to bare net10.0 (no
  # platform suffix) lands here. Android moved to its own job; iOS +
  # Catalyst run on macOS only.
  # ------------------------------------------------------------------
  facade-and-net-backends:
    name: Facade + Desktop/ONNX/MLNet (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-ubuntu-${{ hashFiles('packages/dvai-bridge-dotnet/Directory.Packages.props') }}
          restore-keys: |
            nuget-ubuntu-

      - name: Restore facade + slices
        working-directory: packages/dvai-bridge-dotnet
        run: |
          dotnet restore src/DVAIBridge/DVAIBridge.csproj -p:TargetFrameworks=net10.0
          dotnet restore src/DVAIBridge.Desktop/DVAIBridge.Desktop.csproj
          dotnet restore src/DVAIBridge.OnnxRuntime/DVAIBridge.OnnxRuntime.csproj
          dotnet restore src/DVAIBridge.MLNet/DVAIBridge.MLNet.csproj

      - name: Build facade (net10.0)
        working-directory: packages/dvai-bridge-dotnet
        run: dotnet build src/DVAIBridge/DVAIBridge.csproj -c Release -f net10.0 --no-restore

      - name: Build Desktop slice
        working-directory: packages/dvai-bridge-dotnet
        run: dotnet build src/DVAIBridge.Desktop/DVAIBridge.Desktop.csproj -c Release --no-restore

      - name: Build ONNX Runtime slice
        working-directory: packages/dvai-bridge-dotnet
        run: dotnet build src/DVAIBridge.OnnxRuntime/DVAIBridge.OnnxRuntime.csproj -c Release --no-restore

      - name: Build ML.NET slice
        working-directory: packages/dvai-bridge-dotnet
        run: dotnet build src/DVAIBridge.MLNet/DVAIBridge.MLNet.csproj -c Release --no-restore

      - name: Build + run facade tests
        working-directory: packages/dvai-bridge-dotnet
        run: |
          dotnet build tests/DVAIBridge.Tests/DVAIBridge.Tests.csproj -c Release
          dotnet test tests/DVAIBridge.Tests/DVAIBridge.Tests.csproj -c Release --no-build \
            --collect:"XPlat Code Coverage" \
            --logger "trx;LogFileName=test-results-facade.trx"

      - name: Build + run Desktop tests
        working-directory: packages/dvai-bridge-dotnet
        run: |
          dotnet build tests/DVAIBridge.Desktop.Tests/DVAIBridge.Desktop.Tests.csproj -c Release
          dotnet test tests/DVAIBridge.Desktop.Tests/DVAIBridge.Desktop.Tests.csproj -c Release --no-build \
            --logger "trx;LogFileName=test-results-desktop.trx"

      - name: Build + run ONNX tests
        working-directory: packages/dvai-bridge-dotnet
        run: |
          dotnet build tests/DVAIBridge.OnnxRuntime.Tests/DVAIBridge.OnnxRuntime.Tests.csproj -c Release
          dotnet test tests/DVAIBridge.OnnxRuntime.Tests/DVAIBridge.OnnxRuntime.Tests.csproj -c Release --no-build \
            --logger "trx;LogFileName=test-results-onnx.trx"

      - name: Build + run ML.NET tests
        working-directory: packages/dvai-bridge-dotnet
        run: |
          dotnet build tests/DVAIBridge.MLNet.Tests/DVAIBridge.MLNet.Tests.csproj -c Release
          dotnet test tests/DVAIBridge.MLNet.Tests/DVAIBridge.MLNet.Tests.csproj -c Release --no-build \
            --logger "trx;LogFileName=test-results-mlnet.trx"

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-ubuntu
          path: packages/dvai-bridge-dotnet/tests/**/TestResults/**/coverage.cobertura.xml
          if-no-files-found: ignore

  # ------------------------------------------------------------------
  # Windows: full desktop run on the host that ships the win-x64 / win-arm64
  # native llama.cpp binaries. Repeats the Desktop / ONNX / ML.NET tests on
  # the actual Windows toolchain so we catch P/Invoke / runtime resolver
  # drift before consumers do.
  # ------------------------------------------------------------------
  windows-desktop:
    name: Desktop + ONNX + MLNet (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet
        uses: actions/cache@v6
        with:
          path: ~\.nuget\packages
          key: nuget-windows-${{ hashFiles('packages/dvai-bridge-dotnet/Directory.Packages.props') }}
          restore-keys: |
            nuget-windows-

      - name: Restore + build slices
        working-directory: packages/dvai-bridge-dotnet
        shell: pwsh
        run: |
          dotnet restore src/DVAIBridge.Desktop/DVAIBridge.Desktop.csproj
          dotnet restore src/DVAIBridge.OnnxRuntime/DVAIBridge.OnnxRuntime.csproj
          dotnet restore src/DVAIBridge.MLNet/DVAIBridge.MLNet.csproj
          dotnet build src/DVAIBridge.Desktop/DVAIBridge.Desktop.csproj -c Release --no-restore
          dotnet build src/DVAIBridge.OnnxRuntime/DVAIBridge.OnnxRuntime.csproj -c Release --no-restore
          dotnet build src/DVAIBridge.MLNet/DVAIBridge.MLNet.csproj -c Release --no-restore

      - name: Build + run desktop tests
        working-directory: packages/dvai-bridge-dotnet
        shell: pwsh
        run: |
          dotnet test tests/DVAIBridge.Desktop.Tests/DVAIBridge.Desktop.Tests.csproj -c Release `
            --logger "trx;LogFileName=test-results-desktop-win.trx"
          dotnet test tests/DVAIBridge.OnnxRuntime.Tests/DVAIBridge.OnnxRuntime.Tests.csproj -c Release `
            --logger "trx;LogFileName=test-results-onnx-win.trx"
          dotnet test tests/DVAIBridge.MLNet.Tests/DVAIBridge.MLNet.Tests.csproj -c Release `
            --logger "trx;LogFileName=test-results-mlnet-win.trx"

  # ------------------------------------------------------------------
  # Android binding compile-only check on Ubuntu (no instrumentation —
  # we only verify Metadata.xml + class-parse produce a clean C# wrapper).
  # ------------------------------------------------------------------
  # ------------------------------------------------------------------
  # Build the Kotlin AARs from THIS commit so the C# binding always matches
  # the Kotlin API it wraps. (Pre-4.3.0 this downloaded a hard-pinned
  # 4.0.0 AAR from Maven Central, whose file name never matched the
  # csproj's native/dvai-bridge-$(Version).aar include.) Building here also
  # removes the race with publish.yml on tag pushes.
  # ------------------------------------------------------------------
  android-aars:
    name: Build Android AARs from source (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-dotnet-aars-${{ hashFiles('packages/dvai-bridge-android*/android/**/*.gradle*', 'packages/dvai-bridge-android/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-dotnet-aars-

      - name: Build umbrella + shared-core AARs and kotlin-coroutines reference jar
        run: |
          VER=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' packages/dvai-bridge-dotnet/Directory.Build.props)
          for m in shared-core llama-core mediapipe-core litert-core; do
            (cd packages/dvai-bridge-android-$m/android && ./gradlew publishToMavenLocal --no-daemon --stacktrace)
          done
          (cd packages/dvai-bridge-android/android && ./gradlew assembleRelease --no-daemon --stacktrace)
          mkdir -p out
          cp packages/dvai-bridge-android/android/build/outputs/aar/dvai-bridge-android-release.aar "out/dvai-bridge-$VER.aar"
          cp packages/dvai-bridge-android-shared-core/android/build/outputs/aar/dvai-bridge-android-shared-core-release.aar "out/android-shared-core-$VER.aar"
          curl -L \
            "https://repo1.maven.org/maven2/org/jetbrains/kotlin/kotlin-stdlib/2.3.21/kotlin-stdlib-2.3.21.jar" \
            -o /tmp/kotlin-stdlib-2.3.21.jar
          mkdir -p /tmp/k && cd /tmp/k
          unzip -q -o /tmp/kotlin-stdlib-2.3.21.jar \
            'kotlin/coroutines/Continuation.class' \
            'kotlin/coroutines/CoroutineContext.class' \
            'kotlin/coroutines/CoroutineContext$*.class' \
            'kotlin/coroutines/EmptyCoroutineContext.class' \
            'kotlin/Result.class' \
            'kotlin/Result$*.class' \
            'kotlin/jvm/functions/Function1.class' \
            'kotlin/jvm/functions/Function2.class' \
            'kotlin/Unit.class'
          jar cf /tmp/kotlin-coroutines-min.jar kotlin
          cd -
          cp /tmp/kotlin-coroutines-min.jar out/kotlin-coroutines-min.jar
          ls -la out

      - uses: actions/upload-artifact@v7
        with:
          name: android-aars
          path: out/
          if-no-files-found: error

  android-binding:
    name: Android binding compile (Ubuntu)
    needs: android-aars
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      # Restore from the project (inside global.json's scope) so the installed
      # workload matches exactly what net10.0-android36.0 resolves against.
      - name: Install Android workload
        working-directory: packages/dvai-bridge-dotnet
        run: dotnet workload restore src/DVAIBridge.Android/DVAIBridge.Android.csproj

      - name: Cache NuGet
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-android-${{ hashFiles('packages/dvai-bridge-dotnet/Directory.Packages.props') }}
          restore-keys: |
            nuget-android-

      - name: Download Android AARs built from this commit
        uses: actions/download-artifact@v8
        with:
          name: android-aars
          path: packages/dvai-bridge-dotnet/src/DVAIBridge.Android/native
      - name: Restore Android binding
        working-directory: packages/dvai-bridge-dotnet
        run: dotnet restore src/DVAIBridge.Android/DVAIBridge.Android.csproj

      - name: Build Android binding (with bindings-generated active)
        working-directory: packages/dvai-bridge-dotnet
        run: dotnet build src/DVAIBridge.Android/DVAIBridge.Android.csproj -c Release --no-restore -p:BindingsGenerated=true

  # ------------------------------------------------------------------
  # macOS: builds the Swift xcframework + the iOS + Catalyst binding csproj
  # + the Desktop slice (osx-arm64 Metal-enabled native llama bundle).
  # Also handles full-solution pack + tag-gated NuGet.org push for all six
  # NuGet IDs.
  # ------------------------------------------------------------------
  ios-catalyst-and-pack:
    name: iOS + xcframework + pack (macOS)
    needs: android-aars
    runs-on: [self-hosted, macOS, ARM64]
    # Bumped to 150 minutes — cold-cache run hit the 90 min cap at
    # step #10 mid-xcframework build (run 26141432701). With the llama
    # xcframework cache step below restoring most of the heavy work,
    # warm-cache runs should land in ~30-40 min; 150 min keeps the
    # cap well clear of the cold-cache wall-clock (~80-100 min).
    timeout-minutes: 150
    # DVAIBridge.iOS native umbrella's Package.swift pulls the LiteRT-LM
    # Swift SDK by revision. That repo LFS-tracks Android prebuilt .so
    # files (libGemmaModelConstraintProvider.so et al.), and GitHub's
    # LFS server intermittently 404s on those Android blobs — killing
    # SPM's git-checkout with:
    #   git-lfs: remote missing object 985ec577...
    #   fatal: prebuilt/android_arm64/libGemmaModelConstraintProvider.so:
    #     smudge filter lfs failed
    # We don't need those .so files on .NET/iOS; skip LFS smudge so the
    # checkout lays down LFS pointers as-is and SPM continues. Same fix
    # applied to test-ios-bridge.yml in v4.2.1 — this workflow was
    # missed and hit the same wall.
    env:
      GIT_LFS_SKIP_SMUDGE: 1
    steps:
      # The llama.cpp git submodule is needed for the
      # mac-side-prepare-xcframework.sh step below — it builds the llama +
      # mtmd xcframeworks from llama.cpp source. Only this job uses them;
      # the other jobs (Ubuntu, Windows) deliberately skip submodules to
      # keep their checkouts fast.
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Restore from the projects (inside global.json's scope) so the installed
      # workloads match what the iOS / Android TFMs resolve against.
      - name: Install ios + android workloads
        working-directory: packages/dvai-bridge-dotnet
        run: |
          dotnet workload restore src/DVAIBridge.iOS/DVAIBridge.iOS.csproj
          dotnet workload restore src/DVAIBridge.Android/DVAIBridge.Android.csproj

      - name: Cache NuGet
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-macos-${{ hashFiles('packages/dvai-bridge-dotnet/Directory.Packages.props') }}
          restore-keys: |
            nuget-macos-

      # Self-hosted Mac (macOS 27 / Xcode 27.2): the .NET iOS workload
      # (27.2) requires Xcode 27.2, which GitHub-hosted macOS runners do
      # not ship yet. The runner uses the default Xcode; no xcode-select.
      - name: Check Metal Toolchain (mlx-swift kernels need it)
        run: xcrun metal --version || xcodebuild -downloadComponent MetalToolchain

      # Cache the built llama+mtmd xcframeworks keyed by the llama.cpp
      # git submodule SHA. The actual build (next step) short-circuits
      # if the xcframework dirs already exist, so a cache hit drops the
      # ~25-min compile down to a ~30-second restore. Cache key uses
      # the submodule's commit SHA so any submodule bump invalidates
      # automatically.
      - name: Cache llama + mtmd xcframeworks
        uses: actions/cache@v6
        with:
          path: |
            packages/dvai-bridge-android-llama-core/android/src/main/cpp/native/llama.cpp/build-apple/llama.xcframework
            packages/dvai-bridge-android-llama-core/android/src/main/cpp/native/llama.cpp/build-apple/mtmd.xcframework
          key: llama-mtmd-xcframework-${{ hashFiles('packages/dvai-bridge-android-llama-core/android/src/main/cpp/native/llama.cpp/.git') }}
          restore-keys: |
            llama-mtmd-xcframework-

      - name: Prepare llama + mtmd xcframeworks (for the iOS umbrella SwiftPM resolve)
        # The DVAIBridge.iOS native umbrella's Package.swift declares
        # binaryTarget entries pointing at
        # packages/dvai-bridge-android-llama-core/.../build-apple/{llama,mtmd}.xcframework
        # — built fresh from the llama.cpp submodule by this script.
        # Required before build-xcframework.sh (next step), which packages
        # the DVAIBridge.xcframework that links against them.
        # Short-circuits to a no-op if the cache step above restored
        # the dirs already.
        run: bash scripts/mac-side-prepare-xcframework.sh

      - name: Build xcframework (iOS slices)
        working-directory: packages/dvai-bridge-dotnet/src/DVAIBridge.iOS/native
        run: bash build-xcframework.sh

      - name: Prepare osx-arm64 llama.cpp binary
        run: bash scripts/mac-side-prepare-llama-desktop.sh
        continue-on-error: true

      - name: Download Android AARs built from this commit
        uses: actions/download-artifact@v8
        with:
          name: android-aars
          path: packages/dvai-bridge-dotnet/src/DVAIBridge.Android/native
      - name: Restore solution
        working-directory: packages/dvai-bridge-dotnet
        run: dotnet restore DVAIBridge.sln

      - name: Build iOS binding
        working-directory: packages/dvai-bridge-dotnet
        run: dotnet build src/DVAIBridge.iOS/DVAIBridge.iOS.csproj -c Release --no-restore

      - name: Build Desktop slice (osx-arm64)
        working-directory: packages/dvai-bridge-dotnet
        run: dotnet build src/DVAIBridge.Desktop/DVAIBridge.Desktop.csproj -c Release --no-restore

      - name: Build all packages (with bindings-generated active)
        working-directory: packages/dvai-bridge-dotnet
        run: dotnet build DVAIBridge.sln -c Release --no-restore -p:BindingsGenerated=true

      - name: Pack all six NuGets
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish == 'true')
        working-directory: packages/dvai-bridge-dotnet
        run: dotnet pack DVAIBridge.sln -c Release -o ./out --no-build -p:BindingsGenerated=true

      - name: Upload .nupkg artifacts
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish == 'true')
        uses: actions/upload-artifact@v7
        with:
          name: nupkgs
          path: |
            packages/dvai-bridge-dotnet/out/*.nupkg
            packages/dvai-bridge-dotnet/out/*.snupkg

      # Tag-gated NuGet.org push for all six packages. The wildcard picks
      # up DVAIBridge / .iOS / .Android / .Desktop / .OnnxRuntime / .MLNet
      # in one push; --skip-duplicate makes re-runs safe.
      - name: Push to NuGet.org
        if: (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish == 'true')) && env.NUGET_API_KEY != ''
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        working-directory: packages/dvai-bridge-dotnet
        run: |
          dotnet nuget push ./out/*.nupkg \
            --source https://api.nuget.org/v3/index.json \
            --api-key "${NUGET_API_KEY}" \
            --skip-duplicate

      # Self-hosted Mac: the workspace persists between runs. Drop the
      # per-run xcarchives (~11 GB) and llama.cpp intermediate build dirs
      # so the disk doesn't fill. Keeps build-apple/ (the finished
      # xcframeworks) and SwiftPM's .build for the next run.
      - name: Clean per-run build outputs
        if: always()
        run: |
          rm -rf packages/dvai-bridge-dotnet/src/DVAIBridge.iOS/native/build
          cd packages/dvai-bridge-android-llama-core/android/src/main/cpp/native/llama.cpp
          for d in build-*/; do [ "$d" = "build-apple/" ] || rm -rf "$d"; done
